name: Publish to PyPI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' ruff build
      - run: ruff check arara_api_sdk
      - run: python -m pytest
      - run: python -m build

      - name: Resolve version
        id: version
        run: |
          NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          LOCAL=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://pypi.org/pypi/$NAME/$LOCAL/json" || true)
          case "$STATUS" in
            200)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$NAME $LOCAL ja existe no PyPI, nada a publicar"
              ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::PyPI respondeu HTTP $STATUS ao checar $NAME $LOCAL; abortando sem publicar"
              exit 1
              ;;
          esac
          echo "version=$LOCAL" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" dist/* --title "$TAG" --generate-notes
